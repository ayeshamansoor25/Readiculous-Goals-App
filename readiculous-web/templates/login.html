{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:auto">
 <h2>Login</h2>
 <form method="post">
  <label>Username</label><input name="username" required style="width:100%">
  <label>Password</label><input name="password" type="password" required style="width:100%">
  <p><button>Login</button> <a href="{{ url_for('register') }}">Create account</a></p>
 </form>
</div>
{% endblock %}
